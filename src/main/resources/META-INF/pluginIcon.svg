<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- White background: keeps the mark legible in light theme and on the Marketplace listing card -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- A git commit graph line with a clock-like circle, evoking "blame/history without slowdown" -->
  <line x1="220" y1="512" x2="804" y2="512" stroke="#0151FC" stroke-width="28"/>
  <circle cx="300" cy="512" r="60" fill="#0151FC"/>
  <circle cx="512" cy="512" r="60" fill="#01B3FD"/>
  <circle cx="724" cy="512" r="60" fill="#02F172"/>
  <path d="M 512,472 L 512,512 L 545,535" stroke="#12203A" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
